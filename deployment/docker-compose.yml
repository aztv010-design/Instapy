version: '3.9'

services:

  # PostgreSQL Database
  postgres:
    container_name: ${POSTGRES_CONTAINER:-instapy_postgres}
    image: postgres:${POSTGRES_VERSION:-15}
    environment:
      POSTGRES_DB: ${DB_NAME:-instapy_db}
      POSTGRES_USER: ${DB_USER:-instapy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    networks:
      - instapy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-instapy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis Cache
  redis:
    container_name: ${REDIS_CONTAINER:-instapy_redis}
    image: redis:${REDIS_VERSION:-7}-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - instapy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Elasticsearch Search Engine
  elasticsearch:
    container_name: ${ELASTICSEARCH_CONTAINER:-instapy_elasticsearch}
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.5.0}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - instapy_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # Django Backend
  instapy:
    container_name: ${INSTAPY_CONTAINER:-instapy_backend}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: gunicorn instapy.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-instapy_db}
      - DB_USER=${DB_USER:-instapy}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - TZ=${TZ:-UTC}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - instapy_logs:/var/log/instapy
      - instapy_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - instapy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Celery Worker
  celery:
    container_name: instapy_celery
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A instapy worker -l info
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-instapy_db}
      - DB_USER=${DB_USER:-instapy}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - TZ=${TZ:-UTC}
    volumes:
      - ../backend:/app
    depends_on:
      - instapy
      - redis
    networks:
      - instapy_network
    restart: always

  # React Frontend
  frontend:
    container_name: ${FRONTEND_CONTAINER:-instapy_frontend}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    ports:
      - "${INSTAPY_PORT:-9003}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - instapy
    networks:
      - instapy_network
    restart: always

  # Nginx Reverse Proxy
  nginx:
    container_name: instapy_nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/nginx/certs:ro
    depends_on:
      - instapy
      - frontend
    networks:
      - instapy_network
    restart: always

networks:
  instapy_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.21.0.0/16}

volumes:
  postgres_data:
  postgres_logs:
  redis_data:
  elasticsearch_data:
  instapy_logs:
  instapy_media:
